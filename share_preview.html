<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pyrex Spinna Beat Player - Share Link Preview</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #141414;
      --accent: #d4af37;
      --text: #ffffff;
      --text-muted: #a0a0a0;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .player-container {
      background: var(--card);
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid #333;
      max-width: 400px;
      width: 90%;
    }
    h3 { margin-top: 0; color: var(--accent); }
    #current-track-title { font-size: 1.25rem; margin-bottom: 1.5rem; }
    audio { width: 100%; filter: invert(100%) hue-rotate(180deg) brightness(1.5); }
    .status-badge {
      display: inline-block;
      margin-top: 1rem;
      font-size: 0.8rem;
      padding: 0.25rem 0.75rem;
      background: rgba(212, 175, 55, 0.1);
      color: var(--accent);
      border-radius: 100px;
    }
  </style>
</head>
<body>

<div class="player-container" id="audio-player-container">
  <h3 id="current-track-title">Detecting Shared Beat...</h3>
  <audio id="native-audio-player" controls>
    <source id="audio-source" src="" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>
  <div id="status" class="status-badge">Waiting for path...</div>
</div>

<script>
  /**
   * 1. RUN IMMEDIATELY ON DOM LOAD
   * This logic extracts the beat ID from shared URLs like "/beats/lofi-chill"
   */
  window.addEventListener('DOMContentLoaded', () => {
    const currentPath = window.location.pathname;
    const titleDisplay = document.getElementById('current-track-title');
    const statusDisplay = document.getElementById('status');
    
    // Check if we are on a shared beat path
    if (currentPath.startsWith('/beats/')) {
      const beatSlug = currentPath.replace('/beats/', '');
      statusDisplay.textContent = "Loading shared track: " + beatSlug;
      autoLoadSharedBeat(beatSlug);
    } else {
      titleDisplay.textContent = "No shared track found in URL";
      statusDisplay.textContent = "Use /beats/your-beat-id";
    }
  });

  /**
   * 2. LOAD & PLAY DYNAMICALLY
   * Connects the URL slug to the actual audio source
   */
  function autoLoadSharedBeat(beatSlug) {
    const player = document.getElementById('native-audio-player');
    const source = document.getElementById('audio-source');
    const titleDisplay = document.getElementById('current-track-title');
    
    // Format the title for display
    const formattedTitle = beatSlug
      .split('-')
      .map(word => word.charAt(0).toUpperCase() + word.slice(1))
      .join(' ');
      
    titleDisplay.textContent = formattedTitle;
    
    // Logic: In a real app, you would fetch the URL from your database.
    // For this preview, we map to your storage pattern.
    const audioUrl = `https://storage.googleapis.com/beatstore-assets/beats/${beatSlug}.mp3`;
    
    source.src = audioUrl;
    
    // Reset and attempt playback
    player.load();
    player.play().catch(err => {
      console.log("Auto-play blocked by browser. User must click play.");
      document.getElementById('status').textContent = "Click Play to Start";
    });
  }

  /**
   * 3. HANDLE BROWSER NAVIGATION (Back/Forward)
   */
  window.addEventListener('popstate', (event) => {
    if (event.state && event.state.path) {
      const beatSlug = event.state.path.replace('/beats/', '');
      autoLoadSharedBeat(beatSlug);
    }
  });
</script>

</body>
</html>
